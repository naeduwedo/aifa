services:
  postgres:
    image: postgres:16-alpine
    container_name: aifa-postgres
    environment:
      POSTGRES_USER: aifa
      POSTGRES_PASSWORD: aifa_secret
      POSTGRES_DB: aifa
    ports:
      - "5432:5432"
    volumes:
      - aifa_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aifa -d aifa"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: aifa-redis
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - aifa_redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  aifa_pgdata:
  aifa_redisdata:
